<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FNYJS – Produkter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .serif {
        font-family: "Playfair Display", serif;
      }
    </style>
  </head>

  <body class="bg-white text-neutral-800">
    <!-- NAV -->
    <header class="w-full fixed top-0 left-0 bg-white/80 backdrop-blur-md z-50 border-b border-neutral-200">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="serif text-2xl tracking-wide font-semibold">FNYJS</h1>
        <nav class="flex gap-8 text-sm">
          <a href="index.html" class="hover:text-neutral-500 transition">Forside</a>
          <a href="productlist.html" class="hover:text-neutral-500 transition">Produkter</a>
          <a href="om-os.html" class="hover:text-neutral-500 transition">Om os</a>
        </nav>
      </div>
    </header>

    <!-- CONTENT -->
    <section class="pt-32 pb-24 bg-neutral-50">
      <div class="max-w-7xl mx-auto px-6">
        <h2 class="serif text-4xl font-semibold mb-12 text-center">Alle Produkter</h2>

        <div class="grid md:grid-cols-3 gap-12">
          <!-- PRODUCT TEMPLATE -->
          <div class="group">
            <div class="h-80 bg-[url('https://images.unsplash.com/photo-1585238342028-78d387f1c1a9')] bg-cover bg-center rounded-2xl shadow-md group-hover:shadow-xl transition"></div>
            <h4 class="serif text-xl mt-4">Silk Radiance Foundation</h4>
            <p class="text-neutral-600 text-sm">DKK 249,-</p>
          </div>

          <div class="group">
            <div class="h-80 bg-[url('https://images.unsplash.com/photo-1596464716127-f21a6f1f1cfa')] bg-cover bg-center rounded-2xl shadow-md group-hover:shadow-xl transition"></div>
            <h4 class="serif text-xl mt-4">Petal Kiss Lip Tint</h4>
            <p class="text-neutral-600 text-sm">DKK 149,-</p>
          </div>

          <div class="group">
            <div class="h-80 bg-[url('https://images.unsplash.com/photo-1585238342028-78d387f1c1a9')] bg-cover bg-center rounded-2xl shadow-md group-hover:shadow-xl transition"></div>
            <h4 class="serif text-xl mt-4">Glow Serum Elixir</h4>
            <p class="text-neutral-600 text-sm">DKK 299,-</p>
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="py-12 bg-neutral-900 text-neutral-200">
      <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-3 gap-12">
        <div>
          <h4 class="serif text-xl mb-4">FNYJS</h4>
          <p class="text-sm text-neutral-400">Eksklusiv makeup inspireret af naturens elegance.</p>
        </div>
        <div>
          <h5 class="text-sm font-semibold mb-3">Navigation</h5>
          <ul class="space-y-2 text-neutral-400 text-sm">
            <li><a href="index.html">Forside</a></li>
            <li><a href="productlist.html">Produkter</a></li>
            <li><a href="om-os.html">Om os</a></li>
          </ul>
        </div>
      </div>
    </footer>
  </body>
</html>
